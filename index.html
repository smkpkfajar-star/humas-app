<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Superapp Humas — SMK Tamansiswa Jetis</title>
    <meta name="description" content="Kumpulan aplikasi layanan Humas SMK Tamansiswa Jetis dalam satu tempat.">
    <meta name="theme-color" content="#1E6B4B">
    <meta name="color-scheme" content="only light">
    <link rel="icon" href="/PKL/laporan_PKL/assets/logo-sekolah.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/portal.css">
</head>

<body>
    <header class="top">
        <div class="wrap top__inner">
            <img src="/PKL/laporan_PKL/assets/logo-sekolah.png" alt="" width="40" height="40">
            <div class="top__text">
                <p class="top__title">Superapp Humas</p>
                <p class="top__sub">SMK Tamansiswa Jetis</p>
            </div>
        </div>
    </header>

    <main class="wrap">
        <section class="hero">
            <p class="hero__eyebrow">Superapp Humas</p>
            <h1>Semua layanan Humas, satu pintu.</h1>
            <p class="hero__lead">Pilih aplikasi yang ingin Anda gunakan. Semua berjalan langsung di browser, tidak perlu instal apa pun.</p>
        </section>

        <section aria-labelledby="h-apps">
            <h2 id="h-apps" class="section-title">Aplikasi</h2>
            <div class="grid" id="apps"></div>
        </section>
    </main>

    <footer class="wrap foot">
        <div class="credit">
            <span class="credit__label">Dibuat oleh</span>
            <ul class="credit__list">
                <li>Jurusan DKV</li>
                <li>Jurusan RPL</li>
                <li>Humas</li>
            </ul>
        </div>
        <p>&copy; <span id="year"></span> SMK Tamansiswa Jetis</p>
    </footer>

    <script>
        /* ================================================================
           DAFTAR APLIKASI SUPERAPP
           Untuk menambah aplikasi baru:
           1. Buat folder baru (misal /Alumni/) berisi index.html.
           2. Tambahkan satu objek di daftar di bawah ini.
           status: "aktif" = bisa dibuka, "segera" = tampil tapi belum bisa dibuka.
           ================================================================ */
        var APPS = [
            {
                nama: 'Praktik Kerja Lapangan (PKL)',
                deskripsi: 'Layanan PKL: generator laporan PKL siswa otomatis ke format Word.',
                url: '/PKL/',
                ikon: 'briefcase',
                status: 'aktif'
            },

        ];

        var ICONS = {
            briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M2 13h20"/>',
            file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
            grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>'
        };

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

        document.getElementById('apps').innerHTML = APPS.map(function (a) {
            var aktif = a.status === 'aktif';
            var tag = aktif ? 'a href="' + esc(a.url) + '"' : 'div aria-disabled="true"';
            return '<' + tag + ' class="card' + (aktif ? '' : ' card--off') + '">' +
                '<span class="card__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[a.ikon] || ICONS.grid) + '</svg></span>' +
                '<span class="card__body"><span class="card__name">' + esc(a.nama) + '</span>' +
                '<span class="card__desc">' + esc(a.deskripsi) + '</span></span>' +
                (aktif ? '<span class="card__go" aria-hidden="true">&rarr;</span>' : '<span class="badge">Segera</span>') +
                '</' + (aktif ? 'a' : 'div') + '>';
        }).join('');
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
