<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220" role="img" aria-labelledby="loading-doc-title loading-doc-desc">
  <title id="loading-doc-title">Ilustrasi Proses dan Unduh Dokumen</title>
  <desc id="loading-doc-desc">Aset vektor dokumen laporan yang sedang diproses dengan baris teks, roda gigi berputar, dan tombol panah unduh terpisah untuk animasi loading.</desc>
  <!--
    PANDUAN PIVOT (transform-origin):
    - #roda-gigi   : 172px 62px (rotate 360deg linear infinite)
    - #baris-1..4  : animasi shimmer / scaleX progress
    - #panah-unduh : 168px 158px (bounce vertikal saat siap unduh)
    - #sparkle-1   : twinkle opacity & scale
  -->
  <defs>
    <linearGradient id="doc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F8F6"/>
    </linearGradient>
  </defs>

  <!-- Bayangan -->
  <ellipse id="bayangan" cx="116" cy="196" rx="64" ry="9" fill="#1E6B4B" opacity="0.14"/>

  <!-- Dekorasi sparkle -->
  <g id="dekorasi">
    <g id="sparkle-1" transform="translate(46 58)">
      <path d="M0 -8 Q1.6 -1.6 8 0 Q1.6 1.6 0 8 Q-1.6 1.6 -8 0 Q-1.6 -1.6 0 -8 Z" fill="#F4B942"/>
    </g>
    <circle cx="196" cy="112" r="4" fill="#2A8A61" opacity="0.45"/>
  </g>

  <!-- Lembar Dokumen Belakang (depth) -->
  <rect x="54" y="42" width="108" height="136" rx="14" fill="#E6F2EC" stroke="#1E6B4B" stroke-width="2" transform="rotate(-6 108 110)"/>

  <!-- Lembar Dokumen Utama -->
  <g id="dokumen" data-part="document">
    <rect x="64" y="34" width="108" height="142" rx="14" fill="url(#doc-bg)" stroke="#1F2933" stroke-width="2.4"/>
    <!-- Header hijau tipis -->
    <rect x="78" y="50" width="52" height="10" rx="5" fill="#1E6B4B"/>
    <!-- Baris teks terpisah untuk animasi mengetik / progress -->
    <rect id="baris-1" x="78" y="72" width="80" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect id="baris-2" x="78" y="88" width="68" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect id="baris-3" x="78" y="104" width="76" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect id="baris-4" x="78" y="120" width="52" height="7" rx="3.5" fill="#2A8A61" opacity="0.55"/>
    <!-- Label kecil .DOCX -->
    <rect x="78" y="142" width="48" height="20" rx="6" fill="#E6F2EC" stroke="#1E6B4B" stroke-width="1.6"/>
    <text x="102" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#1E6B4B">DOCX</text>
  </g>

  <!-- Roda Gigi Proses (pivot: 174px 62px) -->
  <g id="roda-gigi" data-part="gear" transform="translate(174 62)">
    <g fill="#F4B942" stroke="#1F2933" stroke-width="2">
      <rect x="-4" y="-22" width="8" height="44" rx="3"/>
      <rect x="-4" y="-22" width="8" height="44" rx="3" transform="rotate(45)"/>
      <rect x="-4" y="-22" width="8" height="44" rx="3" transform="rotate(90)"/>
      <rect x="-4" y="-22" width="8" height="44" rx="3" transform="rotate(135)"/>
      <circle cx="0" cy="0" r="15"/>
    </g>
    <circle cx="0" cy="0" r="6.5" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
  </g>

  <!-- Badge Panah Unduh -->
  <g id="badge-unduh" data-part="download-badge" transform="translate(168 158)">
    <circle cx="0" cy="0" r="22" fill="#1E6B4B" stroke="#FFFFFF" stroke-width="3"/>
    <g id="panah-unduh" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M0 -9 V6"/>
      <path d="M-6 1 L0 7 L6 1"/>
      <path d="M-8 11 H8"/>
    </g>
  </g>
</svg>
