<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-labelledby="siswi-rig-title siswi-rig-desc">
  <title id="siswi-rig-title">Karakter Siswi SMK Tamansiswa Jetis (Modular Rig)</title>
  <desc id="siswi-rig-desc">Aset vektor siswi SMK berhijab dengan struktur layer dan ID identik untuk animasi interaktif: kepala, mata, pupil, kelopak, mulut, lengan, badan, rok, tas, dan bayangan.</desc>
  <!--
    PANDUAN PIVOT (transform-origin) UNTUK ANIMASI CSS/JS:
    - #bayangan      : 160px 336px (scaleX saat melompat/mengambang)
    - #karakter      : 160px 330px (breathing / bounce seluruh tubuh)
    - #badan         : 160px 250px (sway / breathing torso)
    - #tas-belakang  : 160px 215px (follow-through sway)
    - #lengan-kiri   : 124px 188px (ayun lengan kiri)
    - #lengan-kanan  : 196px 188px (melambai / menunjuk)
    - #kepala        : 160px 158px (mengangguk / miring kepala)
    - #pupil-kiri    : 142px 120px (eye tracking kursor, geser max ±3px)
    - #pupil-kanan   : 178px 120px (eye tracking kursor, geser max ±3px)
    - #kelopak       : toggle opacity 0 -> 1 untuk kedip mata
    - #mulut-senyum / #mulut-senang / #mulut-bicara : toggle opacity untuk ganti ekspresi
  -->
  <defs>
    <linearGradient id="tie-grad-f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A8A61"/>
      <stop offset="100%" stop-color="#1E6B4B"/>
    </linearGradient>
    <linearGradient id="skirt-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="bag-grad-f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A8A61"/>
      <stop offset="100%" stop-color="#165239"/>
    </linearGradient>
    <linearGradient id="hijab-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF5F0"/>
    </linearGradient>
    <clipPath id="clip-eye-fl">
      <ellipse cx="142" cy="120" rx="7.5" ry="8.5"/>
    </clipPath>
    <clipPath id="clip-eye-fr">
      <ellipse cx="178" cy="120" rx="7.5" ry="8.5"/>
    </clipPath>
  </defs>

  <!-- Bayangan lantai -->
  <g id="bayangan" data-part="shadow">
    <ellipse cx="160" cy="336" rx="56" ry="10" fill="#1E6B4B" opacity="0.14"/>
  </g>

  <!-- Dekorasi mengambang -->
  <g id="dekorasi" data-part="decorations">
    <g id="sparkle-1" transform="translate(76 76)">
      <path d="M0 -9 Q1.8 -1.8 9 0 Q1.8 1.8 0 9 Q-1.8 1.8 -9 0 Q-1.8 -1.8 0 -9 Z" fill="#F4B942"/>
    </g>
    <g id="sparkle-2" transform="translate(246 116)">
      <path d="M0 -6 Q1.2 -1.2 6 0 Q1.2 1.2 0 6 Q-1.2 1.2 -6 0 Q-1.2 -1.2 0 -6 Z" fill="#2A8A61" opacity="0.8"/>
    </g>
    <circle id="dot-1" cx="68" cy="134" r="3.5" fill="#1E6B4B" opacity="0.35"/>
  </g>

  <!-- Karakter Utama -->
  <g id="karakter" data-part="character">

    <!-- Tas Ransel -->
    <g id="tas-belakang" data-part="backpack">
      <rect x="108" y="178" width="104" height="78" rx="22" fill="url(#bag-grad-f)" stroke="#1F2933" stroke-width="2.4"/>
      <path d="M122 186 H198" stroke="#E6F2EC" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    </g>

    <!-- Kaki & Sepatu -->
    <g id="kaki" data-part="legs">
      <!-- Kaki Kiri -->
      <g id="kaki-kiri" data-part="leg-left">
        <rect x="137" y="308" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
        <path d="M153 319 H135 C125 319 121 325 121 331 C121 334 124 335 129 335 H152 C155 335 156 333 156 330 V322 C156 320 155 319 153 319 Z" fill="#1F2933"/>
        <path d="M124 332 H154" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- Kaki Kanan -->
      <g id="kaki-kanan" data-part="leg-right">
        <rect x="169" y="308" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
        <path d="M167 319 H185 C195 319 199 325 199 331 C199 334 196 335 191 335 H168 C165 335 164 333 164 330 V322 C164 320 165 319 167 319 Z" fill="#1F2933"/>
        <path d="M166 332 H196" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Lengan Kiri (Lengan panjang putih, pivot: 124px 188px) -->
    <g id="lengan-kiri" data-part="arm-left">
      <!-- Tangan kiri -->
      <path d="M113 241 C111 249 114 256 120 256 C125 256 128 251 128 244 Z" fill="#F3C39A" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Lengan baju panjang -->
      <path d="M129 179 C119 182 114 192 110 215 L108 240 C108 243 111 245 115 245 L127 245 C130 245 131 243 131 240 L135 186 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Manset halus -->
      <path d="M109 237 H130" stroke="#DCE2DD" stroke-width="2.4"/>
    </g>

    <!-- Lengan Kanan (Lengan panjang putih, pivot: 196px 188px) -->
    <g id="lengan-kanan" data-part="arm-right">
      <g id="tangan-kanan" data-part="hand-right">
        <path d="M207 241 C209 249 206 256 200 256 C195 256 192 251 192 244 Z" fill="#F3C39A" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      </g>
      <!-- Lengan baju panjang -->
      <path d="M191 179 C201 182 206 192 210 215 L212 240 C212 243 209 245 205 245 L193 245 C190 245 189 243 189 240 L185 186 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M190 237 H211" stroke="#DCE2DD" stroke-width="2.4"/>
    </g>

    <!-- Badan / Seragam & Rok Panjang Abu SMK -->
    <g id="badan" data-part="torso">
      <!-- Rok Panjang A-Line Abu SMK -->
      <path d="M132 244 H188 L199 311 C199 314 196 316 192 316 H128 C124 316 121 314 121 311 Z" fill="url(#skirt-grad)" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Lipatan rok rapi -->
      <path d="M148 250 L144 314" stroke="#334155" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
      <path d="M172 250 L176 314" stroke="#334155" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

      <!-- Kemeja Putih SMK -->
      <path d="M128 179 C136 174 148 172 160 172 C172 172 184 174 192 179 L189 246 H131 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Sabuk hitam & gesper emas -->
      <rect x="131" y="242" width="58" height="7" rx="2" fill="#1F2933"/>
      <rect x="155" y="241" width="10" height="9" rx="2" fill="#F4B942" stroke="#1F2933" stroke-width="1.5"/>

      <!-- Tali Tas Ransel -->
      <path d="M135 178 C132 198 131 218 133 241" fill="none" stroke="#1E6B4B" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M185 178 C188 198 189 218 187 241" fill="none" stroke="#1E6B4B" stroke-width="6.5" stroke-linecap="round"/>

      <!-- Saku Kemeja & Emblem Sekolah -->
      <path d="M168 206 H181 V218 C181 220.5 178.5 222 174.5 222 C170.5 222 168 220.5 168 218 Z" fill="#F8FAFC" stroke="#1F2933" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="174.5" cy="213.5" r="3.2" fill="#1E6B4B"/>
      <circle cx="174.5" cy="213.5" r="1.3" fill="#F4B942"/>

      <!-- Dasi Hijau Zamrud (ujung terlihat rapi di bawah drape hijab) -->
      <g id="dasi" data-part="tie">
        <path d="M156 196 L164 196 L166 232 L160 239 L154 232 Z" fill="url(#tie-grad-f)" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>
        <path d="M155.5 216 L164.6 211" stroke="#F4B942" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Kepala & Hijab (pivot: 160px 158px) -->
    <g id="kepala" data-part="head">
      <!-- Hijab Bagian Belakang / Luar -->
      <g id="hijab-belakang" data-part="hijab-back">
        <path d="M110 118 C110 78 130 60 160 60 C190 60 210 78 210 118 C210 150 206 174 196 192 C185 203 173 206 160 206 C147 206 135 203 124 192 C114 174 110 150 110 118 Z" fill="url(#hijab-grad)" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      </g>

      <!-- Inner ciput hijau zamrud tipis -->
      <path d="M122 110 C122 83 137 72 160 72 C183 72 198 83 198 110 Z" fill="#1E6B4B"/>

      <!-- Wajah -->
      <g id="wajah" data-part="face">
        <path d="M122 114 C122 89 137 79 160 79 C183 79 198 89 198 114 C198 142 183 160 160 160 C137 160 122 142 122 114 Z" fill="#F3C39A" stroke="#1F2933" stroke-width="2.2"/>

        <!-- Rona pipi -->
        <g id="pipi" data-part="cheeks" opacity="0.42">
          <ellipse cx="133" cy="134" rx="7.5" ry="4.2" fill="#F08A78"/>
          <ellipse cx="187" cy="134" rx="7.5" ry="4.2" fill="#F08A78"/>
        </g>

        <!-- Alis -->
        <g id="alis" data-part="eyebrows">
          <path id="alis-kiri" d="M134 106 Q142 102 150 105" fill="none" stroke="#1F2933" stroke-width="2.3" stroke-linecap="round"/>
          <path id="alis-kanan" d="M170 105 Q178 102 186 106" fill="none" stroke="#1F2933" stroke-width="2.3" stroke-linecap="round"/>
        </g>

        <!-- Mata & Pupil Terpisah -->
        <g id="mata" data-part="eyes">
          <!-- Mata Kiri -->
          <g id="mata-kiri" data-part="eye-left">
            <ellipse cx="142" cy="120" rx="7.5" ry="8.5" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
            <!-- Bulu mata halus -->
            <path d="M135 115 L132 113" stroke="#1F2933" stroke-width="2" stroke-linecap="round"/>
            <g id="pupil-kiri" data-part="pupil-left" clip-path="url(#clip-eye-fl)">
              <circle cx="143" cy="120.5" r="4.6" fill="#1F2933"/>
              <circle cx="144.8" cy="118.2" r="1.7" fill="#FFFFFF"/>
            </g>
          </g>
          <!-- Mata Kanan -->
          <g id="mata-kanan" data-part="eye-right">
            <ellipse cx="178" cy="120" rx="7.5" ry="8.5" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
            <path d="M185 115 L188 113" stroke="#1F2933" stroke-width="2" stroke-linecap="round"/>
            <g id="pupil-kanan" data-part="pupil-right" clip-path="url(#clip-eye-fr)">
              <circle cx="179" cy="120.5" r="4.6" fill="#1F2933"/>
              <circle cx="180.8" cy="118.2" r="1.7" fill="#FFFFFF"/>
            </g>
          </g>
        </g>

        <!-- Kelopak Mata Kedip (default opacity 0) -->
        <g id="kelopak" data-part="eyelids" opacity="0">
          <ellipse cx="142" cy="120" rx="8.5" ry="9.5" fill="#F3C39A"/>
          <path d="M134 121 Q142 126 150 121" fill="none" stroke="#1F2933" stroke-width="2.4" stroke-linecap="round"/>
          <ellipse cx="178" cy="120" rx="8.5" ry="9.5" fill="#F3C39A"/>
          <path d="M170 121 Q178 126 186 121" fill="none" stroke="#1F2933" stroke-width="2.4" stroke-linecap="round"/>
        </g>

        <!-- Hidung -->
        <path id="hidung" d="M159 126 Q162 130 158 132" fill="none" stroke="#C98D62" stroke-width="2" stroke-linecap="round"/>

        <!-- Mulut (3 variasi siap toggle) -->
        <g id="mulut" data-part="mouth">
          <path id="mulut-senyum" data-expression="smile" d="M149 140 Q160 150 171 140" fill="none" stroke="#1F2933" stroke-width="2.4" stroke-linecap="round"/>
          <g id="mulut-senang" data-expression="happy" opacity="0">
            <path d="M148 139 Q160 153 172 139 Z" fill="#C94B57" stroke="#1F2933" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M151 140 H169" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
          </g>
          <ellipse id="mulut-bicara" data-expression="talk" cx="160" cy="143" rx="5.5" ry="4.5" fill="#C94B57" stroke="#1F2933" stroke-width="2.2" opacity="0"/>
        </g>
      </g>

      <!-- Lipatan Depan Hijab & Bros Hijau-Emas -->
      <g id="hijab-depan" data-part="hijab-front">
        <path d="M123 145 C132 162 146 168 160 168 C174 168 188 162 197 145 C200 164 195 182 184 193 C174 201 167 204 160 204 C153 204 146 201 136 193 C125 182 120 164 123 145 Z" fill="url(#hijab-grad)" stroke="#1F2933" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Garis lipatan halus hijab -->
        <path d="M134 176 Q160 190 186 176" fill="none" stroke="#C5D8CE" stroke-width="2" stroke-linecap="round"/>
        <!-- Bros kecil warna brand -->
        <circle cx="160" cy="168" r="4.5" fill="#1E6B4B" stroke="#1F2933" stroke-width="1.6"/>
        <circle cx="160" cy="168" r="1.8" fill="#F4B942"/>
      </g>
    </g>
  </g>
</svg>
