<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-labelledby="siswa-wave-title siswa-wave-desc">
  <title id="siswa-wave-title">Siswa SMK Menyapa dan Melambai</title>
  <desc id="siswa-wave-desc">Aset vektor siswa SMK laki-laki melambaikan tangan sambil membawa buku catatan, dengan layer terpisah siap animasi.</desc>
  <!--
    PANDUAN PIVOT (transform-origin):
    - #lengan-kanan : 194px 186px (ayun melambai: rotate(-10deg) <-> rotate(12deg))
    - #tangan-kanan : 230px 142px (goyang pergelangan tangan)
    - #kepala       : 160px 158px (angguk ramah)
    - #dekorasi     : float vertikal lembut
  -->
  <defs>
    <linearGradient id="tie-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A8A61"/>
      <stop offset="100%" stop-color="#1E6B4B"/>
    </linearGradient>
    <linearGradient id="pants-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="bag-w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A8A61"/>
      <stop offset="100%" stop-color="#165239"/>
    </linearGradient>
    <clipPath id="clip-wl">
      <ellipse cx="142" cy="120" rx="7.5" ry="8.5"/>
    </clipPath>
    <clipPath id="clip-wr">
      <ellipse cx="178" cy="120" rx="7.5" ry="8.5"/>
    </clipPath>
  </defs>

  <g id="bayangan" data-part="shadow">
    <ellipse cx="160" cy="336" rx="58" ry="10" fill="#1E6B4B" opacity="0.14"/>
  </g>

  <!-- Dekorasi gerak & sapaan -->
  <g id="dekorasi" data-part="decorations">
    <!-- Garis gerak lambaian -->
    <g id="garis-lambai" stroke="#2A8A61" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M254 106 Q262 115 260 126"/>
      <path d="M263 111 Q269 118 268 126" opacity="0.55"/>
    </g>
    <g id="sparkle-1" transform="translate(76 92)">
      <path d="M0 -8 Q1.6 -1.6 8 0 Q1.6 1.6 0 8 Q-1.6 1.6 -8 0 Q-1.6 -1.6 0 -8 Z" fill="#F4B942"/>
    </g>
    <g id="sparkle-2" transform="translate(242 74)">
      <path d="M0 -6 Q1.2 -1.2 6 0 Q1.2 1.2 0 6 Q-1.2 1.2 -6 0 Q-1.2 -1.2 0 -6 Z" fill="#F4B942" opacity="0.9"/>
    </g>
    <circle id="dot-1" cx="68" cy="146" r="3.5" fill="#1E6B4B" opacity="0.35"/>
  </g>

  <g id="karakter" data-part="character">
    <!-- Tas Ransel -->
    <g id="tas-belakang" data-part="backpack">
      <rect x="108" y="176" width="104" height="82" rx="22" fill="url(#bag-w)" stroke="#1F2933" stroke-width="2.4"/>
      <path d="M122 184 H198" stroke="#E6F2EC" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    </g>

    <!-- Kaki -->
    <g id="kaki" data-part="legs">
      <g id="kaki-kiri" data-part="leg-left">
        <path d="M132 248 L129 312 Q129 316 134 316 H152 Q155 316 155 312 L158 248 Z" fill="url(#pants-w)" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
        <rect x="134" y="314" width="16" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
        <path d="M152 319 H133 C123 319 118 325 118 331 C118 334 121 335 126 335 H151 C154 335 155 333 155 330 V322 C155 320 154 319 152 319 Z" fill="#1F2933"/>
        <path d="M121 332 H153" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g id="kaki-kanan" data-part="leg-right">
        <path d="M162 248 L165 312 Q165 316 168 316 H186 Q191 316 191 312 L188 248 Z" fill="url(#pants-w)" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
        <rect x="170" y="314" width="16" height="8" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
        <path d="M168 319 H187 C197 319 202 325 202 331 C202 334 199 335 194 335 H169 C166 335 165 333 165 330 V322 C165 320 166 319 168 319 Z" fill="#1F2933"/>
        <path d="M167 332 H199" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Lengan Kanan Terangkat Melambai (pivot bahu: 194px 186px) -->
    <g id="lengan-kanan" data-part="arm-right">
      <!-- Lengan baju pendek terangkat -->
      <path d="M188 180 C198 175 212 169 221 158 L231 174 C220 189 206 198 190 202 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Lengan bawah & telapak melambai -->
      <g id="tangan-kanan" data-part="hand-right">
        <path d="M219 162 L231 139 C234 134 242 136 242 143 L232 170 Z" fill="#F3C39A" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
        <!-- Telapak tangan terbuka ramah -->
        <path d="M229 141 C226 135 224 126 227 123 C230 120 233 126 234 130 C235 123 237 117 240 117 C243 117 243 125 242 130 C245 124 249 120 251 122 C254 124 250 132 247 136 C250 133 254 132 255 135 C256 138 250 144 245 147 C240 150 233 148 229 141 Z" fill="#F3C39A" stroke="#1F2933" stroke-width="2.2" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Badan / Seragam -->
    <g id="badan" data-part="torso">
      <path d="M131 242 H189 L190 258 H130 Z" fill="#475569" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M128 178 C136 173 148 171 160 171 C172 171 184 173 192 178 L190 246 H130 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M132 239 H188 V245 H132 Z" fill="#E6F2EC"/>
      <rect x="130" y="244" width="60" height="8" rx="2" fill="#1F2933"/>
      <rect x="154" y="243" width="12" height="10" rx="2" fill="#F4B942" stroke="#1F2933" stroke-width="1.6"/>

      <!-- Tali Tas -->
      <path d="M135 176 C131 196 130 218 132 243" fill="none" stroke="#1E6B4B" stroke-width="7" stroke-linecap="round"/>
      <path d="M185 176 C189 196 190 218 188 243" fill="none" stroke="#1E6B4B" stroke-width="7" stroke-linecap="round"/>

      <!-- Saku & Emblem -->
      <path d="M168 202 H182 V215 C182 218 179 220 175 220 C171 220 168 218 168 215 Z" fill="#F8FAFC" stroke="#1F2933" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="175" cy="210" r="3.4" fill="#1E6B4B"/>
      <circle cx="175" cy="210" r="1.4" fill="#F4B942"/>

      <!-- Dasi -->
      <g id="dasi" data-part="tie">
        <path d="M156 184 L164 184 L166 232 L160 240 L154 232 Z" fill="url(#tie-w)" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>
        <path d="M155.5 212 L164.8 206" stroke="#F4B942" stroke-width="2.4" stroke-linecap="round"/>
        <polygon points="155,179 165,179 163,187 157,187" fill="#1E6B4B" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>
      </g>

      <!-- Kerah -->
      <path d="M148 171 L160 183 L144 188 L140 174 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M172 171 L160 183 L176 188 L180 174 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.2" stroke-linejoin="round"/>
    </g>

    <!-- Lengan Kiri Memeluk Buku Catatan -->
    <g id="lengan-kiri" data-part="arm-left">
      <!-- Buku Hijau di bawah lengan -->
      <g id="properti" data-part="prop-notebook" transform="rotate(-8 118 232)">
        <rect x="96" y="212" width="44" height="52" rx="6" fill="#1E6B4B" stroke="#1F2933" stroke-width="2.2"/>
        <rect x="103" y="212" width="6" height="52" fill="#165239"/>
        <rect x="115" y="224" width="18" height="8" rx="2" fill="#E6F2EC"/>
        <path d="M98 259 H138" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- Lengan baju pendek -->
      <path d="M128 178 C117 182 111 192 109 208 L111 218 L131 220 L135 185 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- Lengan bawah & tangan memeluk buku -->
      <path d="M113 216 C112 229 118 239 135 239 C141 239 144 234 143 229 C142 225 137 224 130 225 C126 225 125 220 127 215 Z" fill="#F3C39A" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
    </g>

    <!-- Kepala (sedikit miring ramah) -->
    <g id="kepala" data-part="head" transform="rotate(-3 160 158)">
      <path d="M151 153 V172 C151 177 169 177 169 172 V153 Z" fill="#E3AD84" stroke="#1F2933" stroke-width="2.4"/>
      <path d="M113 114 C112 80 132 62 160 62 C188 62 208 80 207 114 Z" fill="#1F2933"/>

      <g id="telinga" data-part="ears">
        <circle cx="116" cy="121" r="8.5" fill="#F3C39A" stroke="#1F2933" stroke-width="2.4"/>
        <circle cx="204" cy="121" r="8.5" fill="#F3C39A" stroke="#1F2933" stroke-width="2.4"/>
      </g>

      <g id="wajah" data-part="face">
        <path d="M118 112 C118 84 135 72 160 72 C185 72 202 84 202 112 C202 142 185 161 160 161 C135 161 118 142 118 112 Z" fill="#F3C39A" stroke="#1F2933" stroke-width="2.4"/>
        <g id="pipi" data-part="cheeks" opacity="0.44">
          <ellipse cx="131" cy="134" rx="8" ry="4.5" fill="#F08A78"/>
          <ellipse cx="189" cy="134" rx="8" ry="4.5" fill="#F08A78"/>
        </g>

        <g id="alis" data-part="eyebrows">
          <path id="alis-kiri" d="M133 104 Q142 99 150 103" fill="none" stroke="#1F2933" stroke-width="2.6" stroke-linecap="round"/>
          <path id="alis-kanan" d="M170 103 Q178 99 187 104" fill="none" stroke="#1F2933" stroke-width="2.6" stroke-linecap="round"/>
        </g>

        <g id="mata" data-part="eyes">
          <g id="mata-kiri" data-part="eye-left">
            <ellipse cx="142" cy="120" rx="7.5" ry="8.5" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
            <g id="pupil-kiri" data-part="pupil-left" clip-path="url(#clip-wl)">
              <circle cx="143.5" cy="120" r="4.6" fill="#1F2933"/>
              <circle cx="145.3" cy="117.7" r="1.7" fill="#FFFFFF"/>
            </g>
          </g>
          <g id="mata-kanan" data-part="eye-right">
            <ellipse cx="178" cy="120" rx="7.5" ry="8.5" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
            <g id="pupil-kanan" data-part="pupil-right" clip-path="url(#clip-wr)">
              <circle cx="179.5" cy="120" r="4.6" fill="#1F2933"/>
              <circle cx="181.3" cy="117.7" r="1.7" fill="#FFFFFF"/>
            </g>
          </g>
        </g>

        <g id="kelopak" data-part="eyelids" opacity="0">
          <ellipse cx="142" cy="120" rx="8.5" ry="9.5" fill="#F3C39A"/>
          <path d="M134 121 Q142 126 150 121" fill="none" stroke="#1F2933" stroke-width="2.4" stroke-linecap="round"/>
          <ellipse cx="178" cy="120" rx="8.5" ry="9.5" fill="#F3C39A"/>
          <path d="M170 121 Q178 126 186 121" fill="none" stroke="#1F2933" stroke-width="2.4" stroke-linecap="round"/>
        </g>

        <path id="hidung" d="M159 126 Q162 130 158 132" fill="none" stroke="#C98D62" stroke-width="2" stroke-linecap="round"/>

        <!-- Mulut tersenyum ceria -->
        <g id="mulut" data-part="mouth">
          <path d="M147 139 Q160 154 173 139 Z" fill="#C94B57" stroke="#1F2933" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M150 140.5 H170" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
        </g>
      </g>

      <g id="rambut-depan" data-part="hair-front">
        <path d="M115 113 C112 86 124 64 152 61 C158 55 167 54 172 58 C168 60 165 62 164 63 C192 64 208 82 205 113 C200 100 194 92 184 87 C179 94 172 97 166 98 C168 92 168 88 166 84 C156 94 142 98 130 96 C126 101 121 107 115 113 Z" fill="#1F2933" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>
        <path d="M138 74 C149 69 165 69 178 75" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
      </g>
    </g>
  </g>
</svg>
