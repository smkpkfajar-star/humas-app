<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-labelledby="siswi-lap-title siswi-lap-desc">
  <title id="siswi-lap-title">Siswi SMK Membawa Laptop dan Dokumen</title>
  <desc id="siswi-lap-desc">Aset vektor siswi SMK berhijab membawa laptop dengan badge dokumen tercentang mengambang, siap dianimasikan untuk halaman aplikasi atau PKL.</desc>
  <!--
    PANDUAN PIVOT (transform-origin):
    - #badge-dokumen : 244px 134px (float naik-turun lembut)
    - #properti      : 160px 232px (laptop ikut bernapas lembut)
    - #kepala        : 160px 158px (angguk fokus)
    - #pupil-kiri    : 142px 120px | #pupil-kanan : 178px 120px
  -->
  <defs>
    <linearGradient id="skirt-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="hijab-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF5F0"/>
    </linearGradient>
    <linearGradient id="laptop-lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <clipPath id="clip-ll">
      <ellipse cx="142" cy="120" rx="7.5" ry="8.5"/>
    </clipPath>
    <clipPath id="clip-lr">
      <ellipse cx="178" cy="120" rx="7.5" ry="8.5"/>
    </clipPath>
  </defs>

  <g id="bayangan" data-part="shadow">
    <ellipse cx="160" cy="336" rx="58" ry="10" fill="#1E6B4B" opacity="0.14"/>
  </g>

  <!-- Dekorasi & Badge Dokumen Mengambang -->
  <g id="dekorasi" data-part="decorations">
    <!-- Floating Document Checked Badge -->
    <g id="badge-dokumen" data-part="floating-doc" transform="translate(226 106) rotate(7)">
      <rect x="0" y="0" width="44" height="52" rx="9" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.2"/>
      <rect x="8" y="11" width="18" height="4" rx="2" fill="#1E6B4B" opacity="0.7"/>
      <rect x="8" y="20" width="28" height="3.5" rx="1.75" fill="#CBD5E1"/>
      <rect x="8" y="28" width="22" height="3.5" rx="1.75" fill="#CBD5E1"/>
      <circle cx="34" cy="40" r="10" fill="#1E6B4B" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M29.5 40 L32.6 43.2 L38.8 36.8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="sparkle-1" transform="translate(74 96)">
      <path d="M0 -8 Q1.6 -1.6 8 0 Q1.6 1.6 0 8 Q-1.6 1.6 -8 0 Q-1.6 -1.6 0 -8 Z" fill="#F4B942"/>
    </g>
    <circle id="dot-1" cx="68" cy="148" r="3.5" fill="#2A8A61" opacity="0.45"/>
  </g>

  <g id="karakter" data-part="character">
    <!-- Tas Ransel -->
    <g id="tas-belakang" data-part="backpack">
      <rect x="108" y="178" width="104" height="78" rx="22" fill="#1E6B4B" stroke="#1F2933" stroke-width="2.4"/>
    </g>

    <!-- Kaki & Sepatu -->
    <g id="kaki" data-part="legs">
      <g id="kaki-kiri" data-part="leg-left">
        <rect x="137" y="308" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
        <path d="M153 319 H135 C125 319 121 325 121 331 C121 334 124 335 129 335 H152 C155 335 156 333 156 330 V322 C156 320 155 319 153 319 Z" fill="#1F2933"/>
        <path d="M124 332 H154" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g id="kaki-kanan" data-part="leg-right">
        <rect x="169" y="308" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
        <path d="M167 319 H185 C195 319 199 325 199 331 C199 334 196 335 191 335 H168 C165 335 164 333 164 330 V322 C164 320 165 319 167 319 Z" fill="#1F2933"/>
        <path d="M166 332 H196" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Badan & Rok -->
    <g id="badan" data-part="torso">
      <path d="M132 244 H188 L199 311 C199 314 196 316 192 316 H128 C124 316 121 314 121 311 Z" fill="url(#skirt-l)" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M148 250 L144 314" stroke="#334155" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
      <path d="M172 250 L176 314" stroke="#334155" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

      <path d="M128 179 C136 174 148 172 160 172 C172 172 184 174 192 179 L189 246 H131 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M135 178 C132 198 131 218 133 241" fill="none" stroke="#1E6B4B" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M185 178 C188 198 189 218 187 241" fill="none" stroke="#1E6B4B" stroke-width="6.5" stroke-linecap="round"/>
    </g>

    <!-- Lengan Memegang Laptop -->
    <g id="lengan-kiri" data-part="arm-left">
      <path d="M128 180 C115 186 108 202 108 220 C108 232 114 238 126 238 L134 236 L133 218 L124 218 L134 190 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
    </g>
    <g id="lengan-kanan" data-part="arm-right">
      <path d="M192 180 C205 186 212 202 212 220 C212 232 206 238 194 238 L186 236 L187 218 L196 218 L186 190 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
    </g>

    <!-- Properti Laptop di depan dada -->
    <g id="properti" data-part="laptop">
      <!-- Tutup / Punggung Laptop -->
      <rect x="118" y="206" width="84" height="52" rx="8" fill="url(#laptop-lid)" stroke="#1F2933" stroke-width="2.4"/>
      <!-- Kilau diagonal -->
      <path d="M126 214 L144 214 L126 232 Z" fill="#FFFFFF" opacity="0.45"/>
      <!-- Emblem sekolah di punggung laptop -->
      <circle cx="160" cy="232" r="9" fill="#1E6B4B"/>
      <path d="M156 232 L159 235 L165 229" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Alas keyboard -->
      <rect x="110" y="256" width="100" height="8" rx="4" fill="#94A3B8" stroke="#1F2933" stroke-width="2.2"/>
      <!-- Jari-jari memegang samping laptop -->
      <ellipse cx="120" cy="236" rx="7" ry="6.5" fill="#F3C39A" stroke="#1F2933" stroke-width="2.2"/>
      <ellipse cx="200" cy="236" rx="7" ry="6.5" fill="#F3C39A" stroke="#1F2933" stroke-width="2.2"/>
    </g>

    <!-- Kepala & Hijab -->
    <g id="kepala" data-part="head" transform="rotate(2 160 158)">
      <g id="hijab-belakang" data-part="hijab-back">
        <path d="M110 118 C110 78 130 60 160 60 C190 60 210 78 210 118 C210 150 206 174 196 192 C185 203 173 206 160 206 C147 206 135 203 124 192 C114 174 110 150 110 118 Z" fill="url(#hijab-l)" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      </g>
      <path d="M122 110 C122 83 137 72 160 72 C183 72 198 83 198 110 Z" fill="#1E6B4B"/>

      <g id="wajah" data-part="face">
        <path d="M122 114 C122 89 137 79 160 79 C183 79 198 89 198 114 C198 142 183 160 160 160 C137 160 122 142 122 114 Z" fill="#F3C39A" stroke="#1F2933" stroke-width="2.2"/>
        <g id="pipi" data-part="cheeks" opacity="0.42">
          <ellipse cx="133" cy="134" rx="7.5" ry="4.2" fill="#F08A78"/>
          <ellipse cx="187" cy="134" rx="7.5" ry="4.2" fill="#F08A78"/>
        </g>

        <g id="alis" data-part="eyebrows">
          <path id="alis-kiri" d="M134 106 Q142 102 150 105" fill="none" stroke="#1F2933" stroke-width="2.3" stroke-linecap="round"/>
          <path id="alis-kanan" d="M170 105 Q178 102 186 106" fill="none" stroke="#1F2933" stroke-width="2.3" stroke-linecap="round"/>
        </g>

        <g id="mata" data-part="eyes">
          <g id="mata-kiri" data-part="eye-left">
            <ellipse cx="142" cy="120" rx="7.5" ry="8.5" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
            <path d="M135 115 L132 113" stroke="#1F2933" stroke-width="2" stroke-linecap="round"/>
            <g id="pupil-kiri" data-part="pupil-left" clip-path="url(#clip-ll)">
              <circle cx="143" cy="121.5" r="4.6" fill="#1F2933"/>
              <circle cx="144.8" cy="119.2" r="1.7" fill="#FFFFFF"/>
            </g>
          </g>
          <g id="mata-kanan" data-part="eye-right">
            <ellipse cx="178" cy="120" rx="7.5" ry="8.5" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
            <path d="M185 115 L188 113" stroke="#1F2933" stroke-width="2" stroke-linecap="round"/>
            <g id="pupil-kanan" data-part="pupil-right" clip-path="url(#clip-lr)">
              <circle cx="179" cy="121.5" r="4.6" fill="#1F2933"/>
              <circle cx="180.8" cy="119.2" r="1.7" fill="#FFFFFF"/>
            </g>
          </g>
        </g>

        <g id="kelopak" data-part="eyelids" opacity="0">
          <ellipse cx="142" cy="120" rx="8.5" ry="9.5" fill="#F3C39A"/>
          <path d="M134 121 Q142 126 150 121" fill="none" stroke="#1F2933" stroke-width="2.4" stroke-linecap="round"/>
          <ellipse cx="178" cy="120" rx="8.5" ry="9.5" fill="#F3C39A"/>
          <path d="M170 121 Q178 126 186 121" fill="none" stroke="#1F2933" stroke-width="2.4" stroke-linecap="round"/>
        </g>

        <path id="hidung" d="M159 126 Q162 130 158 132" fill="none" stroke="#C98D62" stroke-width="2" stroke-linecap="round"/>

        <g id="mulut" data-part="mouth">
          <path d="M150 140 Q160 149 170 140" fill="none" stroke="#1F2933" stroke-width="2.4" stroke-linecap="round"/>
        </g>
      </g>

      <g id="hijab-depan" data-part="hijab-front">
        <path d="M123 145 C132 162 146 168 160 168 C174 168 188 162 197 145 C200 164 195 182 184 193 C174 201 167 204 160 204 C153 204 146 201 136 193 C125 182 120 164 123 145 Z" fill="url(#hijab-l)" stroke="#1F2933" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M134 176 Q160 190 186 176" fill="none" stroke="#C5D8CE" stroke-width="2" stroke-linecap="round"/>
        <circle cx="160" cy="168" r="4.5" fill="#1E6B4B" stroke="#1F2933" stroke-width="1.6"/>
        <circle cx="160" cy="168" r="1.8" fill="#F4B942"/>
      </g>
    </g>
  </g>
</svg>
