<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" role="img" aria-labelledby="siswi-win-title siswi-win-desc">
  <title id="siswi-win-title">Siswi SMK Selebrasi Berhasil</title>
  <desc id="siswi-win-desc">Aset vektor siswi SMK berhijab merayakan keberhasilan sambil mengangkat sertifikat atau laporan jadi dengan bintang dan konfeti hijau-emas.</desc>
  <!--
    PANDUAN PIVOT (transform-origin):
    - #karakter     : 160px 320px (animasi bounce gembira)
    - #lengan-kanan : 192px 186px (mengangkat dokumen berhasil)
    - #properti     : 236px 124px (sertifikat/laporan bergoyang ringan)
    - #dekorasi     : pop & float bintang/konfeti
  -->
  <defs>
    <linearGradient id="skirt-fs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="hijab-fs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF5F0"/>
    </linearGradient>
    <linearGradient id="tie-fs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A8A61"/>
      <stop offset="100%" stop-color="#1E6B4B"/>
    </linearGradient>
  </defs>

  <g id="bayangan" data-part="shadow">
    <ellipse cx="160" cy="338" rx="48" ry="8.5" fill="#1E6B4B" opacity="0.14"/>
  </g>

  <g id="dekorasi" data-part="decorations">
    <g id="bintang-1" transform="translate(68 82) rotate(-14)">
      <path d="M0 -12 L3.2 -3.8 L12 -3.3 L5.4 2.4 L7.4 11 L0 6.3 L-7.4 11 L-5.4 2.4 L-12 -3.3 L-3.2 -3.8 Z" fill="#F4B942" stroke="#1F2933" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g id="sparkle-1" transform="translate(158 36)">
      <path d="M0 -8 Q1.6 -1.6 8 0 Q1.6 1.6 0 8 Q-1.6 1.6 -8 0 Q-1.6 -1.6 0 -8 Z" fill="#2A8A61"/>
    </g>
    <rect id="konfeti-1" x="98" y="54" width="10" height="5" rx="2.5" fill="#2A8A61" transform="rotate(-24 103 56)"/>
    <rect id="konfeti-2" x="210" y="50" width="10" height="5" rx="2.5" fill="#F4B942" transform="rotate(20 215 52)"/>
    <circle id="konfeti-3" cx="58" cy="144" r="4" fill="#2A8A61" opacity="0.7"/>
    <circle id="konfeti-4" cx="270" cy="156" r="4" fill="#F4B942"/>
  </g>

  <g id="karakter" data-part="character" transform="translate(0 -6)">
    <g id="tas-belakang" data-part="backpack">
      <rect x="108" y="178" width="104" height="78" rx="22" fill="#1E6B4B" stroke="#1F2933" stroke-width="2.4"/>
    </g>

    <g id="kaki" data-part="legs">
      <g id="kaki-kiri" data-part="leg-left">
        <rect x="135" y="308" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
        <path d="M151 319 H133 C123 319 119 325 119 331 C119 334 122 335 127 335 H150 C153 335 154 333 154 330 V322 C154 320 153 319 151 319 Z" fill="#1F2933"/>
        <path d="M122 332 H152" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g id="kaki-kanan" data-part="leg-right">
        <rect x="171" y="308" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#1F2933" stroke-width="2"/>
        <path d="M169 319 H187 C197 319 201 325 201 331 C201 334 198 335 193 335 H170 C167 335 166 333 166 330 V322 C166 320 167 319 169 319 Z" fill="#1F2933"/>
        <path d="M168 332 H198" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Lengan Kiri Terangkat Semangat -->
    <g id="lengan-kiri" data-part="arm-left">
      <path d="M132 180 C114 176 98 164 86 142 L76 150 C90 176 108 195 130 202 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="81" cy="138" r="9.5" fill="#F3C39A" stroke="#1F2933" stroke-width="2.3"/>
    </g>

    <!-- Lengan Kanan Mengangkat Sertifikat / Laporan Selesai -->
    <g id="lengan-kanan" data-part="arm-right">
      <g id="properti" data-part="prop-certificate" transform="translate(216 94) rotate(14)">
        <rect x="0" y="0" width="46" height="56" rx="7" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.2"/>
        <rect x="8" y="10" width="22" height="5" rx="2.5" fill="#1E6B4B"/>
        <rect x="8" y="20" width="30" height="4" rx="2" fill="#CBD5E1"/>
        <rect x="8" y="28" width="24" height="4" rx="2" fill="#CBD5E1"/>
        <circle cx="34" cy="43" r="9" fill="#F4B942" stroke="#1F2933" stroke-width="1.8"/>
        <path d="M30.5 43 L33 45.5 L38 40.5" fill="none" stroke="#1E6B4B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <path d="M188 180 C206 176 222 164 234 142 L244 150 C230 176 212 195 190 202 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <g id="tangan-kanan" data-part="hand-right">
        <circle cx="238" cy="142" r="9.5" fill="#F3C39A" stroke="#1F2933" stroke-width="2.3"/>
      </g>
    </g>

    <!-- Badan & Rok -->
    <g id="badan" data-part="torso">
      <path d="M132 244 H188 L201 311 C201 314 198 316 194 316 H126 C122 316 119 314 119 311 Z" fill="url(#skirt-fs)" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M148 250 L143 314" stroke="#334155" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
      <path d="M172 250 L177 314" stroke="#334155" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

      <path d="M128 179 C136 174 148 172 160 172 C172 172 184 174 192 179 L189 246 H131 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      <rect x="131" y="242" width="58" height="7" rx="2" fill="#1F2933"/>
      <rect x="155" y="241" width="10" height="9" rx="2" fill="#F4B942" stroke="#1F2933" stroke-width="1.5"/>

      <path d="M135 178 C132 198 131 218 133 241" fill="none" stroke="#1E6B4B" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M185 178 C188 198 189 218 187 241" fill="none" stroke="#1E6B4B" stroke-width="6.5" stroke-linecap="round"/>

      <g id="dasi" data-part="tie">
        <path d="M156 196 L164 196 L166 232 L160 239 L154 232 Z" fill="url(#tie-fs)" stroke="#1F2933" stroke-width="2" stroke-linejoin="round"/>
        <path d="M155.5 216 L164.6 211" stroke="#F4B942" stroke-width="2.2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Kepala Ekspresi Bahagia -->
    <g id="kepala" data-part="head">
      <g id="hijab-belakang" data-part="hijab-back">
        <path d="M110 118 C110 78 130 60 160 60 C190 60 210 78 210 118 C210 150 206 174 196 192 C185 203 173 206 160 206 C147 206 135 203 124 192 C114 174 110 150 110 118 Z" fill="url(#hijab-fs)" stroke="#1F2933" stroke-width="2.4" stroke-linejoin="round"/>
      </g>
      <path d="M122 110 C122 83 137 72 160 72 C183 72 198 83 198 110 Z" fill="#1E6B4B"/>

      <g id="wajah" data-part="face">
        <path d="M122 114 C122 89 137 79 160 79 C183 79 198 89 198 114 C198 142 183 160 160 160 C137 160 122 142 122 114 Z" fill="#F3C39A" stroke="#1F2933" stroke-width="2.2"/>
        <g id="pipi" data-part="cheeks" opacity="0.52">
          <ellipse cx="132" cy="134" rx="8.5" ry="4.5" fill="#F08A78"/>
          <ellipse cx="188" cy="134" rx="8.5" ry="4.5" fill="#F08A78"/>
        </g>

        <g id="alis" data-part="eyebrows">
          <path id="alis-kiri" d="M134 103 Q142 98 150 102" fill="none" stroke="#1F2933" stroke-width="2.3" stroke-linecap="round"/>
          <path id="alis-kanan" d="M170 102 Q178 98 186 103" fill="none" stroke="#1F2933" stroke-width="2.3" stroke-linecap="round"/>
        </g>

        <!-- Mata bahagia (^ ^) -->
        <g id="mata" data-part="eyes">
          <path id="mata-kiri" d="M134 123 Q142 112 150 123" fill="none" stroke="#1F2933" stroke-width="2.9" stroke-linecap="round"/>
          <path id="mata-kanan" d="M170 123 Q178 112 186 123" fill="none" stroke="#1F2933" stroke-width="2.9" stroke-linecap="round"/>
        </g>

        <path id="hidung" d="M159 126 Q162 130 158 132" fill="none" stroke="#C98D62" stroke-width="2" stroke-linecap="round"/>

        <g id="mulut" data-part="mouth">
          <path d="M146 138 Q160 155 174 138 Z" fill="#C94B57" stroke="#1F2933" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M150 139.6 H170" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
        </g>
      </g>

      <g id="hijab-depan" data-part="hijab-front">
        <path d="M123 145 C132 162 146 168 160 168 C174 168 188 162 197 145 C200 164 195 182 184 193 C174 201 167 204 160 204 C153 204 146 201 136 193 C125 182 120 164 123 145 Z" fill="url(#hijab-fs)" stroke="#1F2933" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M134 176 Q160 190 186 176" fill="none" stroke="#C5D8CE" stroke-width="2" stroke-linecap="round"/>
        <circle cx="160" cy="168" r="4.5" fill="#1E6B4B" stroke="#1F2933" stroke-width="1.6"/>
        <circle cx="160" cy="168" r="1.8" fill="#F4B942"/>
      </g>
    </g>
  </g>
</svg>
